<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist Studio v2.6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .badge-netflix { background-color: #ef4444; }
        .badge-prime { background-color: #0284c7; }
        .badge-hotstar { background-color: #0d9488; }
        .badge-jiocinema { background-color: #ec4899; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen p-4 md:p-8 max-w-7xl mx-auto transition-colors duration-200">

    <!-- Splash Cover Screen -->
    <div id="splashScreen" class="flex flex-col items-center justify-center min-h-[80vh] text-center">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl">
            <div class="text-5xl mb-4">🍿</div>
            <h1 class="text-3xl font-extrabold text-sky-500 dark:text-sky-400 mb-2">Watchlist Studio</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mb-6">Your Centralized Media Dashboard</p>
            
            <ul class="text-left text-xs text-slate-700 dark:text-slate-300 space-y-3 mb-8 bg-slate-50 dark:bg-slate-950 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                <li class="flex items-center gap-2"><span class="text-emerald-500">✓</span> Track India Streaming (IN)</li>
                <li class="flex items-center gap-2"><span class="text-amber-500">⭐</span> Fetch Ratings & Posters</li>
                <li class="flex items-center gap-2"><span class="text-indigo-500">📦</span> Group by Genre/Language</li>
                <li class="flex items-center gap-2"><span class="text-sky-500">⚡</span> Live Multi-Device Sync</li>
            </ul>

            <button id="googleSignInBtn" class="w-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:bg-slate-800 dark:hover:bg-slate-100 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition-all shadow-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="appDashboard" class="hidden">
        <header class="flex justify-between items-center mb-6 pb-4 border-b border-slate-300 dark:border-slate-800">
            <div>
                <h1 class="text-2xl font-bold text-sky-600 dark:text-sky-400 flex items-center gap-2">🍿 Watchlist Studio <span class="text-xs bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-400 border border-sky-300 dark:border-sky-800 px-2 py-0.5 rounded-full">v2.6.0</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="p-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-lg text-sm hover:border-sky-400 transition-colors">☀️/🌙</button>
                <div id="userProfileInfo" class="flex items-center gap-2">
                    <img id="userAvatar" class="w-8 h-8 rounded-full border border-sky-400" src="" alt="User">
                    <span id="userNameDisplay" class="text-xs font-semibold text-slate-700 dark:text-slate-300"></span>
                    <button id="signOutBtn" class="text-xs bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-400 border border-rose-300 dark:border-rose-800 px-3 py-1.5 rounded-lg hover:bg-rose-200 dark:hover:bg-rose-900">Sign Out</button>
                </div>
            </div>
        </header>

        <!-- Search & Add Bar -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 mb-6 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <input type="text" id="title" placeholder="Add a title (e.g. Inception, Sacred Games)..." class="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-sm col-span-2">
                <button onclick="addItem()" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 px-4 rounded-lg text-sm transition-colors">+ Add Title</button>
            </div>

            <div class="flex flex-wrap gap-4 items-center justify-between pt-4 border-t border-slate-200 dark:border-slate-800">
                <input type="text" id="searchQuery" placeholder="🔍 Search existing titles..." oninput="renderWatchlist()" class="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-sm flex-1 max-w-xs">
                <button id="toggleFilterDrawerBtn" onclick="toggleFilterDrawer()" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-700">🎛️ Filters & Views</button>
            </div>

            <!-- Filter Drawer -->
            <div id="filterDrawer" class="hidden md:grid grid-cols-2 md:grid-cols-4 gap-4 pt-4 mt-4 border-t border-slate-200 dark:border-slate-800">
                <div>
                    <label class="block text-[10px] uppercase text-slate-500 dark:text-slate-400 mb-1">Type</label>
                    <select id="filterType" onchange="renderWatchlist()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded p-2 text-xs"><option value="All">All Types</option><option value="movie">Movies</option><option value="tv">TV Shows</option></select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-slate-500 dark:text-slate-400 mb-1">Platform</label>
                    <select id="filterPlatform" onchange="renderWatchlist()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded p-2 text-xs"><option value="All">All Platforms</option></select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-slate-500 dark:text-slate-400 mb-1">Genre</label>
                    <select id="filterGenre" onchange="renderWatchlist()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded p-2 text-xs"><option value="All">All Genres</option></select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-slate-500 dark:text-slate-400 mb-1">Language</label>
                    <select id="filterLanguage" onchange="renderWatchlist()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded p-2 text-xs"><option value="All">All Languages</option></select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-slate-500 dark:text-slate-400 mb-1">Primary Group</label>
                    <select id="primaryGroupSelect" onchange="renderWatchlist()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded p-2 text-xs"><option value="none">None</option><option value="platform">Platform</option><option value="genre">Genre</option><option value="language">Language</option><option value="type">Type</option><option value="status">Status</option></select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-slate-500 dark:text-slate-400 mb-1">Secondary Group</label>
                    <select id="secondaryGroupSelect" onchange="renderWatchlist()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded p-2 text-xs"><option value="none">None</option><option value="platform">Platform</option><option value="genre">Genre</option><option value="language">Language</option><option value="type">Type</option><option value="status">Status</option></select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-slate-500 dark:text-slate-400 mb-1">Sort By</label>
                    <select id="sortBy" onchange="renderWatchlist()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded p-2 text-xs"><option value="default">Default</option><option value="rating-desc">⭐ Highest Rating</option><option value="title-asc">Title (A-Z)</option><option value="title-desc">Title (Z-A)</option></select>
                </div>
            </div>
        </div>

        <!-- Watchlist Display Grid -->
        <div id="watchlistDisplay"></div>
    </div>

    <!-- Firebase Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
