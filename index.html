<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist Studio - Phase 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍿 Watchlist Studio</h1>
    </header>

    <div class="grid-forms">
        <!-- Single Add Panel -->
        <div class="panel">
            <h3>Add Single Title</h3>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="e.g., Oppenheimer">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="platform">Platform</label>
                    <select id="platform">
                        <option value="Netflix">Netflix</option>
                        <option value="Prime Video">Prime Video</option>
                        <option value="Disney+">Disney+</option>
                        <option value="Hotstar">Hotstar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <select id="genre">
                        <option value="Action">Action</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Drama">Drama</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" onclick="addItem()">Add to Watchlist</button>
        </div>

        <!-- Bulk Upload Panel -->
        <div class="panel">
            <h3>Bulk Upload</h3>
            <div class="form-group">
                <label for="bulkTitles">Paste Titles (one per line)</label>
                <textarea id="bulkTitles" placeholder="The Dark Knight&#10;Interstellar&#10;Dune"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="bulkPlatform">Default Platform</label>
                    <select id="bulkPlatform">
                        <option value="Netflix">Netflix</option>
                        <option value="Prime Video">Prime Video</option>
                        <option value="Disney+">Disney+</option>
                        <option value="Hotstar">Hotstar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bulkGenre">Default Genre</label>
                    <select id="bulkGenre">
                        <option value="Action">Action</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Drama">Drama</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" onclick="bulkUpload()">Process Batch</button>
        </div>
    </div>

    <!-- Toolbar & Grouping Options -->
    <div class="toolbar">
        <div class="toolbar-top">
            <div class="toolbar-group" style="flex: 2;">
                <label for="searchQuery">🔍 Search Watchlist</label>
                <input type="text" id="searchQuery" placeholder="Filter titles dynamically..." oninput="renderWatchlist()">
            </div>
            <div class="toolbar-group">
                <label for="sortBy">Sort Order</label>
                <select id="sortBy" onchange="renderWatchlist()">
                    <option value="default">Default</option>
                    <option value="title-asc">Title (A-Z)</option>
                    <option value="title-desc">Title (Z-A)</option>
                </select>
            </div>
            <div class="toolbar-group" style="display: flex; gap: 8px; align-items: flex-end;">
                <button class="btn-warning" onclick="deleteSelectedItems()" style="flex: 1;">Delete Selected</button>
                <button class="btn-danger" onclick="clearAllItems()" style="flex: 1;">Delete All</button>
            </div>
        </div>

        <!-- Multi-Grouping Mode Selectors -->
        <div class="grouping-bar">
            <span class="group-tab-label">Group Views:</span>
            <button class="tab-btn active" id="tab-none" onclick="setGrouping('none')">All (List View)</button>
            <button class="tab-btn" id="tab-genre" onclick="setGrouping('genre')">Group by Genre</button>
            <button class="tab-btn" id="tab-platform" onclick="setGrouping('platform')">Group by Platform</button>
            <button class="tab-btn" id="tab-status" onclick="setGrouping('status')">Group by Status</button>
        </div>
    </div>

    <!-- Select All Controls Bar -->
    <div class="select-bar">
        <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
        <label for="selectAll">Select / Deselect All Visible Items</label>
    </div>

    <!-- Watchlist Cards Container -->
    <div id="watchlistDisplay"></div>

    <script src="app.js"></script>
</body>
</html>
