<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist Studio - v2.3.0</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase App & Cloud Firestore (Compat SDK for straightforward browser script usage) -->
     <!-- Firebase SDKs (Browser Compat Version) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>
        <h1>🍿 Watchlist Studio <span class="version-tag">v2.3.0</span></h1>
        <div class="user-profile">
            <input type="text" id="userNameInput" placeholder="Your Name (e.g., Rahul)" style="width: 200px;">
        </div>
    </header>

    <div class="grid-forms">
        <!-- Single Add Panel -->
        <div class="panel">
            <h3>Add Single Title</h3>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="e.g., Oppenheimer or Sacred Games">
            </div>
            <button class="btn-primary" onclick="addItem()">Add to Watchlist (Auto-Detect Provider)</button>
        </div>

        <!-- Bulk Upload Panel -->
        <div class="panel">
            <h3>Bulk Upload</h3>
            <div class="form-group">
                <label for="bulkTitles">Paste Titles (one per line)</label>
                <textarea id="bulkTitles" placeholder="The Dark Knight&#10;Mirzapur&#10;Dune"></textarea>
            </div>
            <button class="btn-primary" id="btnBulkUpload" onclick="bulkUpload()">Process Batch</button>
            <div class="progress-container" id="bulkProgressContainer" style="display: none;">
                <div class="progress-status" id="bulkProgressStatus">Ready</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bulkProgressBar" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Multi-Filter Toolbar -->
    <div class="toolbar">
        <div class="toolbar-top">
            <div class="toolbar-group" style="flex: 2;">
                <label for="searchQuery">🔍 Search Watchlist</label>
                <input type="text" id="searchQuery" placeholder="Search by keyword..." oninput="renderWatchlist()">
            </div>
            <div class="toolbar-group">
                <label for="filterType">Type Filter</label>
                <select id="filterType" onchange="renderWatchlist()">
                    <option value="All">All Types</option>
                    <option value="movie">Movies Only</option>
                    <option value="tv">TV Shows Only</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label for="filterPlatform">Platform Filter</label>
                <select id="filterPlatform" onchange="renderWatchlist()">
                    <option value="All">All Platforms</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label for="filterGenre">Genre Filter</label>
                <select id="filterGenre" onchange="renderWatchlist()">
                    <option value="All">All Genres</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label for="filterStatus">Status Filter</label>
                <select id="filterStatus" onchange="renderWatchlist()">
                    <option value="All">All Statuses</option>
                    <option value="towatch">To Watch</option>
                    <option value="watched">Watched</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label for="sortBy">Sort Order</label>
                <select id="sortBy" onchange="renderWatchlist()">
                    <option value="default">Default</option>
                    <option value="title-asc">Title (A-Z)</option>
                    <option value="title-desc">Title (Z-A)</option>
                </select>
            </div>
        </div>

        <div class="toolbar-actions">
            <button class="btn-warning" onclick="deleteSelectedItems()">Delete Selected</button>
            <button class="btn-danger" onclick="clearAllItems()">Delete All</button>
        </div>

        <!-- Multi-Grouping Board Views -->
        <div class="grouping-bar">
            <span class="group-tab-label">Group Views:</span>
            <button class="tab-btn active" id="tab-none" onclick="setGrouping('none')">All (List View)</button>
            <button class="tab-btn" id="tab-genre" onclick="setGrouping('genre')">Group by Genre</button>
            <button class="tab-btn" id="tab-platform" onclick="setGrouping('platform')">Group by Platform</button>
            <button class="tab-btn" id="tab-type" onclick="setGrouping('type')">Group by Type</button>
            <button class="tab-btn" id="tab-status" onclick="setGrouping('status')">Group by Status</button>
        </div>
    </div>

    <!-- Select All Controls Bar -->
    <div class="select-bar">
        <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
        <label for="selectAll">Select / Deselect All Visible Items</label>
    </div>

    <!-- Watchlist Cards Container -->
    <div id="watchlistDisplay"></div>

    <script src="app.js"></script>
</body>
</html>
