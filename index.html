<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist Studio - Phase 4</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            
            --netflix-red: #ef4444;
            --prime-blue: #0284c7;
            --disney-blue: #2563eb;
            --hotstar-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-indigo));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Top Input Sections */
        .grid-forms {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .grid-forms {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
        }

        .panel h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--accent-blue);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 9px 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--accent-blue);
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-indigo);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #4f46e5;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-warning {
            background: #d97706;
            color: white;
        }

        .btn-warning:hover {
            background: #b45309;
        }

        /* Controls & Grouping Bar */
        .toolbar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .toolbar-top {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar-group {
            flex: 1;
            min-width: 180px;
        }

        /* Grouping Selector Tabs */
        .grouping-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .group-tab-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .tab-btn {
            background: #0f172a;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #0f172a;
            font-weight: 700;
            border-color: var(--accent-blue);
        }

        /* Group Containers */
        .group-section {
            margin-bottom: 30px;
        }

        .group-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .group-count {
            font-size: 12px;
            background: var(--border-color);
            color: var(--text-main);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        /* Watchlist Card */
        .movie-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .movie-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue);
        }

        .movie-card.watched {
            opacity: 0.55;
            background: #161e2e;
        }

        .movie-card.watched .card-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .card-title-box {
            flex: 1;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 10px;
            font-weight: 700;
            color: white;
            border-radius: 10px;
            text-transform: uppercase;
        }
        .badge-netflix { background: var(--netflix-red); }
        .badge-prime { background: var(--prime-blue); }
        .badge-disney { background: var(--disney-blue); }
        .badge-hotstar { background: var(--hotstar-green); }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 11px;
        }

        .select-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍿 Watchlist Studio</h1>
    </header>

    <div class="grid-forms">
        <!-- Single Add Panel -->
        <div class="panel">
            <h3>Add Single Title</h3>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="e.g., Oppenheimer">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="platform">Platform</label>
                    <select id="platform">
                        <option value="Netflix">Netflix</option>
                        <option value="Prime Video">Prime Video</option>
                        <option value="Disney+">Disney+</option>
                        <option value="Hotstar">Hotstar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <select id="genre">
                        <option value="Action">Action</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Drama">Drama</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" onclick="addItem()">Add to Watchlist</button>
        </div>

        <!-- Bulk Upload Panel -->
        <div class="panel">
            <h3>Bulk Upload</h3>
            <div class="form-group">
                <label for="bulkTitles">Paste Titles (one per line)</label>
                <textarea id="bulkTitles" placeholder="The Dark Knight&#10;Interstellar&#10;Dune"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="bulkPlatform">Default Platform</label>
                    <select id="bulkPlatform">
                        <option value="Netflix">Netflix</option>
                        <option value="Prime Video">Prime Video</option>
                        <option value="Disney+">Disney+</option>
                        <option value="Hotstar">Hotstar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bulkGenre">Default Genre</label>
                    <select id="bulkGenre">
                        <option value="Action">Action</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Drama">Drama</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" onclick="bulkUpload()">Process Batch</button>
        </div>
    </div>

    <!-- Toolbar & Grouping Options -->
    <div class="toolbar">
        <div class="toolbar-top">
            <div class="toolbar-group" style="flex: 2;">
                <label for="searchQuery">🔍 Search Watchlist</label>
                <input type="text" id="searchQuery" placeholder="Filter titles dynamically..." oninput="renderWatchlist()">
            </div>
            <div class="toolbar-group">
                <label for="sortBy">Sort Order</label>
                <select id="sortBy" onchange="renderWatchlist()">
                    <option value="default">Default</option>
                    <option value="title-asc">Title (A-Z)</option>
                    <option value="title-desc">Title (Z-A)</option>
                </select>
            </div>
            <div class="toolbar-group" style="display: flex; gap: 8px; align-items: flex-end;">
                <button class="btn-warning" onclick="deleteSelectedItems()" style="flex: 1;">Delete Selected</button>
                <button class="btn-danger" onclick="clearAllItems()" style="flex: 1;">Delete All</button>
            </div>
        </div>

        <!-- Multi-Grouping Mode Selectors -->
        <div class="grouping-bar">
            <span class="group-tab-label">Group Views:</span>
            <button class="tab-btn active" id="tab-none" onclick="setGrouping('none')">All (List View)</button>
            <button class="tab-btn" id="tab-genre" onclick="setGrouping('genre')">Group by Genre</button>
            <button class="tab-btn" id="tab-platform" onclick="setGrouping('platform')">Group by Platform</button>
            <button class="tab-btn" id="tab-status" onclick="setGrouping('status')">Group by Status</button>
        </div>
    </div>

    <!-- Select All Controls Bar -->
    <div class="select-bar">
        <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
        <label for="selectAll">Select / Deselect All Visible Items</label>
    </div>

    <!-- Watchlist Cards Container -->
    <div id="watchlistDisplay"></div>

    <script>
        let activeGrouping = 'none';

        document.addEventListener('DOMContentLoaded', renderWatchlist);

        function getWatchlist() {
            const stored = localStorage.getItem('myWatchlist');
            return stored ? JSON.parse(stored) : [];
        }

        function saveWatchlist(watchlist) {
            localStorage.setItem('myWatchlist', JSON.stringify(watchlist));
        }

        function setGrouping(mode) {
            activeGrouping = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');
            renderWatchlist();
        }

        function getPlatformBadgeClass(platform) {
            switch(platform) {
                case 'Netflix': return 'badge-netflix';
                case 'Prime Video': return 'badge-prime';
                case 'Disney+': return 'badge-disney';
                case 'Hotstar': return 'badge-hotstar';
                default: return '';
            }
        }

        function renderWatchlist() {
            const container = document.getElementById('watchlistDisplay');
            const sortBy = document.getElementById('sortBy').value;
            const searchQuery = document.getElementById('searchQuery').value.toLowerCase().trim();
            
            container.innerHTML = '';
            document.getElementById('selectAll').checked = false;

            let items = getWatchlist();

            // 1. Live Search Filter
            if (searchQuery !== '') {
                items = items.filter(item => item.title.toLowerCase().includes(searchQuery));
            }

            // 2. Sort Items
            if (sortBy === 'title-asc') {
                items.sort((a, b) => a.title.localeCompare(b.title));
            } else if (sortBy === 'title-desc') {
                items.sort((a, b) => b.title.localeCompare(a.title));
            }

            if (items.length === 0) {
                container.innerHTML = `<div class="empty-state">No titles found in your watchlist.</div>`;
                return;
            }

            // 3. Render based on active grouping mode
            if (activeGrouping === 'none') {
                renderGroup(container, 'All Movies & Shows', items);
            } else if (activeGrouping === 'genre') {
                const genres = ['Action', 'Comedy', 'Drama', 'Sci-Fi'];
                genres.forEach(genre => {
                    const groupItems = items.filter(i => i.genre === genre);
                    if (groupItems.length > 0) {
                        renderGroup(container, `${genre} Titles`, groupItems);
                    }
                });
            } else if (activeGrouping === 'platform') {
                const platforms = ['Netflix', 'Prime Video', 'Disney+', 'Hotstar'];
                platforms.forEach(platform => {
                    const groupItems = items.filter(i => i.platform === platform);
                    if (groupItems.length > 0) {
                        renderGroup(container, platform, groupItems);
                    }
                });
            } else if (activeGrouping === 'status') {
                const toWatch = items.filter(i => !i.watched);
                const watched = items.filter(i => i.watched);
                
                if (toWatch.length > 0) renderGroup(container, '⏳ To Watch', toWatch);
                if (watched.length > 0) renderGroup(container, '✅ Watched History', watched);
            }
        }

        function renderGroup(parentContainer, groupTitle, items) {
            const section = document.createElement('div');
            section.className = 'group-section';

            const titleHeader = document.createElement('div');
            titleHeader.className = 'group-title';
            titleHeader.innerHTML = `${groupTitle} <span class="group-count">${items.length}</span>`;
            section.appendChild(titleHeader);

            const grid = document.createElement('div');
            grid.className = 'card-grid';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = `movie-card ${item.watched ? 'watched' : ''}`;
                
                const badgeClass = getPlatformBadgeClass(item.platform);

                card.innerHTML = `
                    <div class="card-header">
                        <input type="checkbox" class="item-checkbox" data-id="${item.id}">
                        <div class="card-title-box">
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">${item.genre}</div>
                        </div>
                        <span class="badge ${badgeClass}">${item.platform}</span>
                    </div>
                    <div class="card-footer">
                        <button class="tab-btn btn-small" onclick="toggleWatched(${item.id})">
                            ${item.watched ? '↩️ Unwatch' : '✓ Watched'}
                        </button>
                        <button class="btn-danger btn-small" onclick="deleteItem(${item.id})">Delete</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            section.appendChild(grid);
            parentContainer.appendChild(section);
        }

        function addItem() {
            const titleInput = document.getElementById('title');
            const platformSelect = document.getElementById('platform');
            const genreSelect = document.getElementById('genre');

            if (titleInput.value.trim() === '') {
                alert('Please enter a title!');
                return;
            }

            const newItem = {
                id: Date.now(),
                title: titleInput.value.trim(),
                platform: platformSelect.value,
                genre: genreSelect.value,
                watched: false
            };

            const items = getWatchlist();
            items.push(newItem);
            saveWatchlist(items);

            renderWatchlist();
            titleInput.value = '';
        }

        function bulkUpload() {
            const bulkText = document.getElementById('bulkTitles').value;
            const platformSelect = document.getElementById('bulkPlatform');
            const genreSelect = document.getElementById('bulkGenre');

            if (bulkText.trim() === '') {
                alert('Please paste at least one title!');
                return;
            }

            const lines = bulkText.split('\n');
            let items = getWatchlist();
            let addedCount = 0;

            lines.forEach((line, index) => {
                const title = line.trim();
                if (title !== '') {
                    items.push({
                        id: Date.now() + index,
                        title: title,
                        platform: platformSelect.value,
                        genre: genreSelect.value,
                        watched: false
                    });
                    addedCount++;
                }
            });

            if (addedCount > 0) {
                saveWatchlist(items);
                renderWatchlist();
                document.getElementById('bulkTitles').value = '';
                alert(`Added ${addedCount} titles successfully!`);
            }
        }

        function toggleWatched(id) {
            let items = getWatchlist();
            items = items.map(item => item.id === id ? { ...item, watched: !item.watched } : item);
            saveWatchlist(items);
            renderWatchlist();
        }

        function deleteItem(id) {
            let items = getWatchlist();
            items = items.filter(item => item.id !== id);
            saveWatchlist(items);
            renderWatchlist();
        }

        function toggleSelectAll(masterCheckbox) {
            document.querySelectorAll('.item-checkbox').forEach(cb => cb.checked = masterCheckbox.checked);
        }

        function deleteSelectedItems() {
            const checkboxes = document.querySelectorAll('.item-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('Please select at least one item to delete.');
                return;
            }

            if (confirm(`Delete ${checkboxes.length} selected item(s)?`)) {
                const selectedIds = Array.from(checkboxes).map(cb => Number(cb.dataset.id));
                let items = getWatchlist().filter(item => !selectedIds.includes(item.id));
                saveWatchlist(items);
                renderWatchlist();
            }
        }

        function clearAllItems() {
            if (confirm('Delete your entire watchlist?')) {
                localStorage.removeItem('myWatchlist');
                renderWatchlist();
            }
        }
    </script>
</body>
</html>
